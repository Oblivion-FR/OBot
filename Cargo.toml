[package]
name = "obot"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/Oblivion-FR/OBot"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
cookie = "0.18"
dotenvy = "0.15.7"
fluent-bundle = "0.16.0"
poise = "0.7.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
unic-langid = "0.9.6"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
