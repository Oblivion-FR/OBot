[package]
name = "obot"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Oblivion-FR/OBot"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
dotenvy = "0.15.7"
poise = "0.7.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
