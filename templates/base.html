<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OBot panel{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #fff; --text: #1d2025; --muted: #626874;
      --border: #dde0e5; --accent: #5865f2; --accent-text: #fff; --danger: #c43d3d;
      --error-bg: #fbeaea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171a; --surface: #1f2125; --text: #e6e7ea; --muted: #9aa0ab;
        --border: #34373d; --accent: #7983f5; --accent-text: #0e0f11; --danger: #ef7a7a;
        --error-bg: #3a2224;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 20px; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; margin-bottom: 16px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .error { background: var(--error-bg); color: var(--danger); border-radius: 6px;
      padding: 8px 12px; margin-bottom: 16px; }
    form.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted);
      flex: 1 1 180px; min-width: 0; }
    select, input { font: inherit; color: var(--text); background: var(--bg); width: 100%;
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
    button { font: inherit; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer;
      background: var(--accent); color: var(--accent-text); }
    button.link { background: none; color: var(--muted); padding: 0; }
    button.danger { background: none; color: var(--danger); padding: 0; }
    ul.list { list-style: none; margin: 0 0 12px; padding: 0; }
    ul.list li { display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 8px 0; border-bottom: 1px solid var(--border); }
    ul.list a { color: var(--accent); text-decoration: none; }
    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body hx-boost="true">
  <header>
    <a href="/">OBot panel</a>
    {% block header %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
