{% for preview in previews %}
<div class="preview-line">
  <span class="hint">{{ lang.t(preview.label) }}</span>
  <code>{% if preview.nickname.is_empty() %}{{ lang.t("preview-unchanged") }}{% else %}{{ preview.nickname }}{% endif %}</code>
  <span class="hint">{{ preview.length() }}/32</span>
</div>
{% endfor %}
