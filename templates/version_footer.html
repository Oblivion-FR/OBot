<footer class="version-footer">
  OBot v{{ crate::version::NUMBER }}
  {% if let Some(url) = crate::version::commit_url() -%}
  (<a href="{{ url }}" target="_blank" rel="noopener" hx-boost="false">{{ crate::version::COMMIT }}</a>)
  {%- else -%}
  ({{ lang.t("unknown-commit") }})
  {%- endif %}
  · <a href="{{ crate::version::REPOSITORY }}" target="_blank" rel="noopener" hx-boost="false">{{ lang.t("footer-source") }}</a>
</footer>
