# Checks the code, then builds the production and development images for x86-64 and ARM64 and
# publishes them to the GitHub container registry, where the Portainer stacks pull them from.
name: Docker images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Installs the release and components from rust-toolchain.toml
      - run: rustup toolchain install
      - name: Dockerfiles use the pinned Rust release
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          for dockerfile in Dockerfile.*; do
            if ! grep -q "^FROM rust:$version-" "$dockerfile"; then
              echo "::error file=$dockerfile::expected FROM rust:$version-…"
              exit 1
            fi
          done
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Each architecture builds on a native runner: compiling Rust under ARM emulation would take far
  # longer. The images are pushed by digest only, then `merge` tags them together.
  build:
    needs: checks
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        environment: [production, development]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7

      # Image names must be lowercase, repository names don't have to be
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Labels only: tags go on the multi-architecture image made by `merge`
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only check that the images build
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.environment }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.environment }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.environment }}-${{ matrix.platform.arch }}

      - if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.environment }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags both architectures of an environment under one name, so each server pulls its own
  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        environment: [production, development]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.environment }}-*
          merge-multiple: true

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # `<environment>` follows the latest build, `<environment>-<commit>` pins one for rollbacks
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ matrix.environment }}
            type=sha,prefix=${{ matrix.environment }}-

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          # shellcheck disable=SC2046 # one argument per tag and per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ matrix.environment }}"
