# Development bot, a separate Discord application with its own database, pulled from the GitHub
# container registry where CI publishes it. It runs a debug build that rebuilds and restarts on
# every change of its sources.
#
# In Portainer: Stacks → Add stack → Repository, compose path `compose.development.yml`, and set
# the variables below in the stack's environment variables.
# Locally with hot reload, add compose.development.watch.yml:
# `docker compose -f compose.development.yml -f compose.development.watch.yml --env-file .env.development watch`
name: obot-development

services:
  obot:
    # `development` follows `main`; set OBOT_TAG to `development-<commit>` to pin a version
    image: ghcr.io/oblivion-fr/obot:${OBOT_TAG:-development}
    pull_policy: always
    restart: unless-stopped
    environment:
      OBOT_ENV: development
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET}
      HYPIXEL_API_KEY: ${HYPIXEL_API_KEY:?set HYPIXEL_API_KEY}
      # Public URL of the panel, its `/callback` must be in the Discord application's redirects
      PANEL_URL: ${PANEL_URL:?set PANEL_URL}
      # A test server, so slash commands update instantly
      GUILD_ID: ${GUILD_ID:-}
    ports:
      # Next to production's 8081, so both can run on the same host
      - ${PANEL_PORT:-8082}:8081
    volumes:
      - data:/data
      # Build output and downloaded crates survive restarts, so rebuilds stay incremental
      - target:/app/target
      - cargo-registry:/usr/local/cargo/registry

volumes:
  # The SQLite database, kept apart from the container so it survives updates
  data:
    name: obot-development-data
  target:
    name: obot-development-target
  cargo-registry:
    name: obot-development-cargo-registry
