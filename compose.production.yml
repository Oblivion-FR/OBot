# Production bot, pulled from the GitHub container registry where CI publishes it. In Portainer:
# Stacks → Add stack → Repository, compose path `compose.production.yml`, and set the variables
# below in the stack's environment variables.
# Locally: `docker compose -f compose.production.yml --env-file .env.production up -d`
name: obot-production

services:
  obot:
    # `production` follows `main`; set OBOT_TAG to `production-<commit>` to pin or roll back
    image: ghcr.io/oblivion-fr/obot:${OBOT_TAG:-production}
    pull_policy: always
    restart: unless-stopped
    environment:
      OBOT_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET}
      HYPIXEL_API_KEY: ${HYPIXEL_API_KEY:?set HYPIXEL_API_KEY}
      # Public URL of the panel, its `/callback` must be in the Discord application's redirects
      PANEL_URL: ${PANEL_URL:?set PANEL_URL}
      # Leave empty in production: commands are registered globally
      GUILD_ID: ${GUILD_ID:-}
      # Hours between refreshes of every verified member, 3 by default, 0 turns them off
      RESYNC_INTERVAL_HOURS: ${RESYNC_INTERVAL_HOURS:-}
      # Discord user IDs, comma separated, who handle GDPR requests in the panel. Empty: nobody
      PRIVACY_ADMIN_IDS: ${PRIVACY_ADMIN_IDS:-}
    ports:
      - ${PANEL_PORT:-8081}:8081
    volumes:
      - data:/data

volumes:
  # The SQLite database, kept apart from the container so it survives updates
  data:
    name: obot-production-data
