[package]
name = "hytools-api"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Oblivion-FR/OBot"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
